# Drop-in for Caddy's unit (/etc/systemd/system/caddy.service.d/bigboss.conf): before every start
# and reload, write the Caddyfile for the server's current public IP (the "+" runs it as root).
# Caddy on CPU 0, at Nice 10, away from the bot's hot cores.
[Service]
ExecStartPre=+/root/Documents/BigBoss/scripts/dashboard-caddy.sh
ExecReload=
ExecReload=+/root/Documents/BigBoss/scripts/dashboard-caddy.sh
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --force
AllowedCPUs=0
Nice=10
