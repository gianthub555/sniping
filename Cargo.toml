[package]
name = "sniper-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# Transaction stream + decoders
carbon-core = { version = "2.0.0", default-features = false, features = ["yellowstone"] }
carbon-log-metrics = "2.0.0"
carbon-yellowstone-grpc-datasource = "2.0.0"
carbon-rpc-transaction-crawler-datasource = "2.0.0"
yellowstone-grpc-proto = { version = "=12.7.0", default-features = false }
yellowstone-grpc-client = "=13.5.0"
carbon-pumpfun-decoder = "2.0.0"
# Decoded shred stream client (ShredStream.com): transactions before they execute.
decoded-shredstream = "0.1"
# Jito ShredStream proxy entries client (same versions as yellowstone-grpc-client).
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
prost = "=0.14.4"
carbon-pump-swap-decoder = "2.0.0"
carbon-raydium-amm-v4-decoder = "2.0.0"
carbon-raydium-cpmm-decoder = "2.0.0"
carbon-raydium-clmm-decoder = "2.0.0"
carbon-raydium-launchpad-decoder = "2.0.0"

# Solana (component crates pinned to the same generation carbon 2.0 uses, so
# Pubkey/Instruction types line up; SPL helper crates are avoided on purpose
# because they still depend on solana-pubkey 3)
solana-rpc-client = "4.2.2"
solana-rpc-client-api = "4.2.2"
solana-account-decoder-client-types = "=4.2.2"
solana-commitment-config = "3"
solana-pubkey = { version = "4", features = ["curve25519"] }
solana-keypair = "3"
solana-signer = "3"
solana-signature = "3"
solana-hash = "4"
solana-account = "4"
solana-instruction = "3"
solana-message = "4"
solana-transaction = { version = "4", features = ["serde"] }
solana-transaction-status-client-types = "4.2.2"

# Runtime / utilities
tokio = { version = "1.48", features = ["full"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "http2"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3.3"
# The wire format of transactions (v1 included), as the Solana crates write it; already in the tree.
wincode = "0.5.5"
base64 = "0.22"
bs58 = "0.5"
rand = "0.8"
# The hot path's presigned Ed25519 (2026-10-11, src/hot/presign.rs): the same curve25519-dalek 4 and
# ed25519-dalek 2 the Solana crates use; fresh randomness from the OS; nonces wiped after use;
# ring's SHA-512 for the one hash on the hot thread (already in the tree through rustls).
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize", "hazmat"] }
curve25519-dalek = { version = "4.1", default-features = false, features = ["zeroize", "precomputed-tables"] }
sha2 = "0.10"
zeroize = "1"
getrandom = "0.2"
ring = "0.17"
dotenvy = "0.15.7"
# The scorecard's new data (deployer wallet funding, launch results, scores, exit decisions): one
# SQLite file, written off the hot path. Bundled so no system library is needed.
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
chrono = "0.4"
colored = "3"
futures = "0.3"
async-trait = "0.1"
tokio-util = "0.7"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# The hot path: a blocking WebSocket on its own thread (same tungstenite as tokio-tungstenite) and
# core pinning.
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
libc = "0.2"
reed-solomon-erasure = "6"
socket2 = { version = "0.6", features = ["all"] }
webpki-roots = "1"
# The staked lane: QUIC straight to the leader's TPU, with Solana's own client certificate code.
quinn = "0.11"
solana-tls-utils = "4.2.2"

[profile.release]
# Fat LTO (2026-10-12): the inline hot path, frame to bytes ready without the window, 8.6 -> 6.7 us
# p50 (decide -18%, build+sign -12%, derive -12%; single-stage benches unchanged), measured
# alternately against thin on the same cores (research/hot-speed-2026-10-11/lto_thin_vs_fat.md).
# Costs build time (about 5 minutes after a code change here). "thin" was the setting before.
lto = "fat"
codegen-units = 1
